[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "reasontree"
version = "1.1.0"
description = "Reasoning-based document retrieval using hierarchical tree indexing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Sunil Gentyala", email = "sunil.gentyala@ieee.org" }
]
keywords = ["rag", "retrieval", "llm", "document", "tree", "reasoning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "litellm>=1.83.0",
    "pymupdf>=1.26.0",
    "PyPDF2>=3.0.1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]
agents = [
    "openai-agents>=0.0.10",
]

[project.scripts]
reasontree = "reasontree.__main__:main"

[project.urls]
Repository = "https://github.com/sunilgentyala/ReasonTree"
Issues = "https://github.com/sunilgentyala/ReasonTree/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py310"
