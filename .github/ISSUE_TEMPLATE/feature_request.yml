name: Feature Request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check the open issues to see if it has already been suggested.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or limitation that motivates this request.
      placeholder: "When indexing very large PDFs (500+ pages), the tree building step takes too long..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you have in mind. Code sketches are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds? What was missing?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Indexing (PDF)
        - Indexing (Markdown)
        - Retrieval / tree search
        - Python API / client
        - CLI
        - Configuration
        - Performance
        - Documentation
        - Tests
        - Other
    validations:
      required: true
